services:
  lab:
    build: .
    network_mode: none
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "test -s \"$$AWS_CA_BUNDLE\" && curl -fsS --cacert \"$$AWS_CA_BUNDLE\" https://127.0.0.1:9297/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 5s
